<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030815">
  <title>야옴 YAOM · 공지</title>
  <link rel="icon" type="image/jpeg" href="https://profile.img.sooplive.co.kr/LOGO/ya/yaom0728/yaom0728.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .n-list{display:flex;flex-direction:column;gap:10px}
    .n-item{border:1px solid var(--line);background:rgba(var(--line-c),.05);cursor:pointer;transition:.2s}
    .n-item:hover{background:rgba(var(--line-c),.1)}
    .n-item.pin{border-left:2px solid var(--cyan)}
    .n-head{display:flex;align-items:center;gap:12px;padding:16px 18px}
    .n-no{flex:0 0 auto;color:var(--tx3);font-family:Arial,sans-serif;font-size:10px;font-weight:900;letter-spacing:.14em}
    .n-pin{flex:0 0 auto;padding:3px 8px;border:1px solid var(--cyan);color:var(--cyan);font-family:Arial,sans-serif;font-size:9px;font-weight:900;letter-spacing:.12em}
    .n-t{flex:1;min-width:0;color:var(--text);font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .n-th{flex:0 0 auto;width:38px;height:38px;object-fit:cover;border:1px solid var(--line)}
    .n-dt{flex:0 0 auto;color:var(--tx3);font-family:Arial,sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.08em}
    .n-ar{flex:0 0 auto;color:var(--cyan);font-size:13px;transition:transform .2s}
    .n-item.open .n-ar{transform:rotate(90deg)}
    .n-body{max-height:0;overflow:hidden;transition:max-height .3s ease;color:var(--tx2);font-size:14px;line-height:1.9;white-space:pre-wrap}
    .n-item.open .n-body{max-height:4000px;padding:0 18px 18px;border-top:1px solid var(--line);margin-top:0}
    .n-item.open .n-inner{padding-top:16px}
    .n-img{display:block;width:100%;margin-bottom:12px;border:1px solid var(--line);cursor:zoom-in}
    @media (max-width:820px){
      .n-head{gap:9px;padding:14px}
      .n-t{font-size:13.5px}
      .n-dt{font-size:9.5px}
      .n-no{display:none}
    }
  </style>
</head>
<body class="sg">
<script>try{if(localStorage.getItem('yaom-mode')==='day')document.body.classList.add('day');}catch(e){}</script>

<div class="sg-grid" aria-hidden="true"></div>
<div class="sg-diag" aria-hidden="true"></div>

<header class="sg-header">
  <a class="wordmark" href="../"><b>야옴</b><span>YAOM</span></a>
  <nav class="sg-nav">
    <a href="../">MAIN</a>
    <a href="../profile/">PROFILE</a>
    <a href="../schedule/">SCHEDULE</a>
    <a href="../song/">SETLIST</a>
    <a href="../notice/" class="act">NOTICE</a>
    <a href="../dress/">WARDROBE</a>
  </nav>
  <div class="sg-right">
    <button class="sg-hbtn" type="button" data-mode>☾ NIGHT</button>
    <button class="sg-hbtn hi" type="button" data-ask>✉ SIGNAL</button>
  </div>
</header>
<nav class="sg-subnav">
  <a href="../">MAIN</a>
  <a href="../profile/">PROFILE</a>
  <a href="../schedule/">SCHEDULE</a>
  <a href="../song/">SETLIST</a>
  <a href="../notice/" class="act">NOTICE</a>
  <a href="../dress/">WARDROBE</a>
</nav>

<main class="sg-main">
  <section class="sg-hero">
    <p class="sg-sig"><i></i>NO.05 <em>/ CHANNEL BROADCAST</em></p>
    <h1><b>공지</b><span>NOTICE</span></h1>
    <p class="kr">이벤트·휴방·규칙 변경 등 공지 사항.</p>
    <div class="sg-ghost" aria-hidden="true">05</div>
  </section>

  <div class="card rv">
    <p class="kick">FILE 01 <em>송출 기록</em> <span id="cnt" style="color:var(--tx3);letter-spacing:.12em"></span></p>
    <div class="n-list" id="list"><div class="spinner"></div></div>
  </div>
</main>

<footer class="sg-footer">
  <p>© 2026 야옴 YAOM Official.<br><b>비즈니스 문의</b> — 상단 SIGNAL 버튼</p>
  <div class="sg-moo"><span>아무래도 아무래도 · 아무래도 아무래도 · 아무래도 아무래도 · </span></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../supabase.js"></script>
<script>
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function imgsOf(n){
  if(Array.isArray(n.images) && n.images.length) return n.images.filter(Boolean).map(String);
  if(typeof n.image_url === 'string' && n.image_url.trim()) return [n.image_url.trim()];
  return [];
}
async function init(){
  let rows = [];
  try{ rows = await fetchAll('notice', { order:'created_at', asc:false }); }catch(e){ rows = []; }
  const all = rows.filter(n => n.pinned).concat(rows.filter(n => !n.pinned));
  const el = document.getElementById('list');
  document.getElementById('cnt').textContent = `· TOTAL ${all.length}`;
  if(!all.length){
    el.innerHTML = '<div class="empty"><span class="ic">✦</span>등록된 공지 없음</div>';
  }else{
    el.innerHTML = all.map(function(n, i){
      const d = new Date(n.created_at);
      const ds = isNaN(d) ? '' : `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      const im = imgsOf(n);
      const thumb = im.length ? `<img class="n-th" src="${esc(im[0])}" loading="lazy" referrerpolicy="no-referrer" alt="">` : '';
      const body = im.map(u => `<img class="n-img" src="${esc(u)}" loading="lazy" referrerpolicy="no-referrer" alt="" onclick="event.stopPropagation();FX.openLb('${esc(u)}','${esc(n.title)}','')">`).join('')
        + `<div>${esc(n.content || '')}</div>`;
      return `<div class="n-item${n.pinned ? ' pin' : ''}" onclick="this.classList.toggle('open')">
        <div class="n-head">
          <span class="n-no">${String(all.length - i).padStart(3,'0')}</span>
          ${n.pinned ? '<span class="n-pin">PINNED</span>' : ''}
          <span class="n-t">${esc(n.title)}</span>
          ${thumb}
          <span class="n-dt">${ds}</span>
          <span class="n-ar">›</span>
        </div>
        <div class="n-body"><div class="n-inner">${body}</div></div>
      </div>`;
    }).join('');
  }
  document.body.classList.add('ready');
  if(window.FX) FX.reveal();
  try{ enableIframeAutoHeight(); }catch(e){}
}
init();
</script>
<script src="../fx.js"></script>
</body>
</html>
