<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>YAOM Overlay</title>
<!--
  OBS 방송용 오버레이 — "지금 트는 노래"를 투명 배경 바로 표시.
  사용법: OBS 브라우저 소스에 이 페이지 주소(.../overlay/) 추가. 700x120 권장.
  관리자 페이지 → 🎵 노래 탭 → "지금 트는 노래"에서 곡을 입력하고 표시 체크 후 저장하면 1.5초 안에 반영돼요.
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ov-main:#22d9ff;     /* 액센트 (라인·아티스트) */
  --ov-bg:rgba(3,9,20,.82);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:700px;height:120px;background:transparent;overflow:hidden;font-family:"Noto Sans KR",Arial,sans-serif}
.bar{
  display:inline-flex;align-items:center;gap:14px;height:88px;max-width:640px;
  margin:16px 0 0 10px;padding:0 22px 0 0;
  border:1px solid rgba(120,220,255,.5);border-left:3px solid var(--ov-main);
  background:var(--ov-bg);backdrop-filter:blur(10px);
  opacity:0;transform:translateX(-8px);transition:opacity .45s ease,transform .45s ease,width .3s ease;
}
.bar.on{opacity:1;transform:none}
.av{width:88px;height:88px;flex:0 0 auto;overflow:hidden;border-right:1px solid rgba(120,220,255,.3)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;padding:2px 0}
.lb{color:var(--ov-main);font-family:Arial,sans-serif;font-size:9px;font-weight:900;letter-spacing:.22em}
.tt{margin-top:5px;color:#f0fbff;font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:460px}
.ar{margin-top:3px;color:rgba(200,235,255,.7);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:460px}
.dot{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--ov-main);box-shadow:0 0 14px var(--ov-main);animation:tw 1.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="av"><img src="https://profile.img.sooplive.co.kr/LOGO/ya/yaom0728/yaom0728.jpg" alt="" onerror="this.style.display='none'"></div>
  <div class="info">
    <div class="lb">NOW PLAYING</div>
    <div class="tt" id="tt">야옴</div>
    <div class="ar" id="ar"></div>
  </div>
  <span class="dot"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://bcdjxstzvrqghlfvqqkk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjZGp4c3R6dnJxZ2hsZnZxcWtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODA2NTAsImV4cCI6MjEwMDc1NjY1MH0.jx1VnbvGCAlmYBaPxc090aTuDzYXjwtgs3VptVn9SwM');
let lastKey = null;
async function poll(){
  try{
    const { data } = await sb.from('overlay_state').select('*').eq('id',1).single();
    const bar = document.getElementById('bar');
    if(!data || !data.is_visible || !data.song_title){ bar.classList.remove('on'); lastKey = null; return; }
    const key = data.song_title + '|' + (data.song_artist || '');
    if(key !== lastKey){
      lastKey = key;
      document.getElementById('tt').textContent = data.song_title;
      document.getElementById('ar').textContent = data.song_artist || '';
    }
    bar.classList.add('on');
  }catch(e){}
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
